name: Staticcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    container:
      image: golang:1.26.10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
